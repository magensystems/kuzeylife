<!doctype html>
<html lang="en">
  <head>
    <title>KUZEY LIFE AR</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>

    <div id="loader-container">
      <img src="/poster.webp" alt="KUZEYLIFE" class="brand-logo">
      <div class="loading-text">Loading Model...</div>
    </div>

    <div id="error-toast"></div>
    

    <model-viewer id="mv"

      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls
      disable-zoom
      ar-scale="fixed"
      tone-mapping="aces" 
      poster="poster.webp" 
      shadow-intensity="0.1"
      autoplay
      environment-image="studio.hdr" exposure="1">

      >
     

      <button slot="ar-button" id="ar-btn" style="display: none;">
        Modeli görüntüleyin
      </button>

    </model-viewer>

     <div id="interaction-hint" slot="interaction-prompt">
  <div class="hand-icon"></div>
  <div class="hint-text">
    <span>Butona tıkladıktan sonra kameranızı hareket ettirin.</span>
    <span>Çizginin dışına dokunarak modeli döndürün.</span>
    <span>Çizginin içine dokunarak modeli taşıyın.</span>
  </div>
</div>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
